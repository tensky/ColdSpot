[versions]
# ColdSpot itself: the plugin, the manifest module and the runtime share one version; the plugin adds the runtime at its own.
coldspot = "0.1.0"
agp = "9.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
# The Kotlin that compiles tooling (the plugin, and diff, bundle and manifest, which it bundles): the newest stable. Its
# output is held to language and API level 2.2, Gradle 9's embedded Kotlin, so that every Gradle 9 can load the plugin
# and read its metadata (manifest holds itself to 2.0, the runtime's level). The sample keeps AGP's built-in Kotlin above.
kotlinTooling = "2.4.20"
# Packs JGit, ASM and jacoco-core into the plugin, and jacoco-core with ASM into the runtime's jar, relocated (4d).
shadow = "9.6.1"
composeBom = "2026.02.01"
jgit = "7.8.0.202609011348-r"
asm = "9.10.1"
hilt = "2.60.1"
ksp = "2.3.12"
jacoco = "0.8.14"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }
android-gradle-api = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
android-gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# The plugins themselves as artifacts, for the plugin's TestKit classpath (its Hilt fixture) only.
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradle-plugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
jacoco-core = { group = "org.jacoco", name = "org.jacoco.core", version.ref = "jacoco" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
# jacoco-core's other two ASM modules, held to asm's version: one ASM, the same in the plugin and on the device.
asm-commons = { group = "org.ow2.asm", name = "asm-commons", version.ref = "asm" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version.ref = "asm" }
# The offline agent runtime (classifier "runtime"): what the instrumented classes call, by name, never relocated.
jacoco-agent = { group = "org.jacoco", name = "org.jacoco.agent", version.ref = "jacoco" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinTooling" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

